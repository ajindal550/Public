<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Octopus Bridge API Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Official REST API documentation for Octopus Bridge — the omni-channel commerce bridge. Manage products, orders, inventory, customers, purchase orders and sales orders across every store you connect. Includes Retail Advisor integration via PO and SO APIs." />
  <meta name="theme-color" content="#0b3d4a" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Open Graph — for link previews in Slack / Teams / iMessage / LinkedIn etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Octopus Bridge, Inc." />
  <meta property="og:title" content="Octopus Bridge API Documentation" />
  <meta property="og:description" content="Official REST API documentation — products, orders, inventory, customers, purchase orders and sales orders. Includes Retail Advisor integration." />
  <meta property="og:url" content="https://developers.octopusbridge.com/" />
  <meta property="og:image" content="https://developers.octopusbridge.com/assets/logo.svg" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Octopus Bridge API Documentation" />
  <meta name="twitter:description" content="Official REST API documentation — the omni-channel commerce bridge for Retail Advisor and beyond." />
  <meta name="twitter:image" content="https://developers.octopusbridge.com/assets/logo.svg" />

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">Loading the Octopus Bridge docs…</div>
  <script>
    window.$docsify = {
      name: 'Octopus Bridge API Documentation',
      repo: '',                       // set after pushing to GitHub
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      coverpage: 'coverpage.md',
      onlyCover: false,
      homepage: 'index.md',
      basePath: 'docs/',
      relativePath: true,
      maxLevel: 4,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the API…',
        noData: 'No results.',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Failed',
        successText: 'Copied'
      },
      pagination: {
        previousText: '← Prev',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    };
  </script>
  <!-- Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy code -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Tabs -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>
  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
</body>
</html>
